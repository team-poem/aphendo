[package]
name = "capture-todo"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
core = { path = "../core" }
xcap = "0.9.8"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-updater = "2"
serde_json = "1.0.154"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
