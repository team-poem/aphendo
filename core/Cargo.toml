[package]
name = "core"
version = "0.1.0"
edition = "2021"

[lib]
name = "capture_core"

[dependencies]
rmcp = { version = "3.7", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "reqwest-native-tls"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
uuid = { version = "1", features = ["v4"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
base64 = "0.22"

[dev-dependencies]
rmcp = { version = "3.7", features = ["server", "macros", "transport-streamable-http-server"] }
