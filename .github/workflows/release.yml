name: Release Windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build
        required: true
        type: string
      runner:
        description: Build runner
        required: true
        type: choice
        default: windows-latest
        options:
          - windows-latest
          - ubuntu-24.04

jobs:
  release:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write
    env:
      TAURI_SIGNING_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check tag matches app version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node -e "const v = require('./src-tauri/tauri.conf.json').version; if (process.env.RELEASE_TAG !== 'v' + v) { console.error('Select the tag matching app version v' + v); process.exit(1); }"

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:release

      - name: Verify existing updater key before building
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/release-signing.mjs preflight

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Windows cross-compilation tools
        if: inputs.runner == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis lld llvm clang
          cargo install --locked cargo-xwin

      - name: Build signed Windows installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          XWIN_ACCEPT_LICENSE: '1'
        run: pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis ${{ inputs.runner == 'ubuntu-24.04' && '--runner cargo-xwin' || '' }} -- --locked

      - name: Verify installer signature and prepare update manifest
        shell: bash
        run: |
          aphendo_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          node scripts/release-signing.mjs prepare "target/x86_64-pc-windows-msvc/release/bundle/nsis/Aphendo_${aphendo_version}_x64-setup.exe"

      - name: Upload verified assets as a draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          aphendo_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          dir=target/x86_64-pc-windows-msvc/release/bundle/nsis
          exe="Aphendo_${aphendo_version}_x64-setup.exe"
          gh release create "$RELEASE_TAG" "$dir/$exe" "$dir/$exe.sig" "$dir/latest.json" --verify-tag --draft --title "$RELEASE_TAG" --notes "변경 사항은 커밋 내역을 확인해 주세요."
