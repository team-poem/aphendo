name: Release Windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build
        required: true
        type: string
      runner:
        description: Build runner
        required: true
        type: choice
        default: windows-latest
        options:
          - windows-latest
          - ubuntu-24.04

jobs:
  release:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Check tag matches app version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node -e "const v = require('./src-tauri/tauri.conf.json').version; if (process.env.RELEASE_TAG !== 'v' + v) { console.error('Select the tag matching app version v' + v); process.exit(1); }"

      - name: Install Windows cross-compilation tools
        if: inputs.runner == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis lld llvm clang
          cargo install --locked cargo-xwin

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

      - name: Build and prepare draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          XWIN_ACCEPT_LICENSE: '1'
        with:
          tagName: ${{ inputs.tag }}
          releaseName: ${{ inputs.tag }}
          releaseBody: ${{ inputs.tag == 'v0.2.17' && '프로그램 아이콘을 새 이미지로 교체했습니다. 업데이트 서명 키가 변경되어 기존 버전 사용자는 이 릴리즈의 설치 파일을 직접 내려받아 한 번 설치해야 합니다.' || '변경 사항은 커밋 내역을 확인해 주세요.' }}
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          args: --target x86_64-pc-windows-msvc --bundles nsis ${{ inputs.runner == 'ubuntu-24.04' && '--runner cargo-xwin' || '' }} -- --locked
